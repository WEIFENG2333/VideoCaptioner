name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - dev

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check videocaptioner/

      - name: Type check CLI
        run: uv run pyright videocaptioner/cli/

      - name: i18n check (源码 key 集 == .pot；基准 zh_Hans 无空译文)
        run: uv run python scripts/i18n.py check
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Unit tests
        run: uv run pytest tests/test_cli tests/test_dubbing tests/test_i18n -q

      - name: Build package
        run: uv build
