[project]
name = "videocaptioner"
dynamic = ["version"]
description = "AI-powered video captioning tool — ASR, subtitle optimization, translation, and synthesis"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [{ name = "Weifeng" }]
requires-python = ">=3.10,<3.13"
keywords = ["video", "caption", "subtitle", "asr", "llm", "translation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "requests>=2.34.2",
    "openai>=2.41.1",
    "diskcache>=5.6.3",
    "yt-dlp>=2026.6.9",
    "json-repair>=0.60.1",
    "langdetect>=1.0.9",
    "pydub>=0.25.1",
    "tenacity>=9.1.4",
    "pillow>=12.2.0",
    "fonttools>=4.63.0",
    "platformdirs>=4.10.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "PyQt5==5.15.11",
    "PyQt-Fluent-Widgets==1.8.4",
    "psutil>=7.2.2",
    "GPUtil>=1.4.0",
    "edge-tts>=7.2.8",
    # request_logger 直接 import httpx；不能依赖 openai 的传递依赖兜底
    "httpx>=0.27.0",
    # 实时字幕：本地麦克风/系统音频采集（PortAudio）、流式 ASR WebSocket、电平计算
    "sounddevice>=0.4.6",
    "websocket-client>=1.7.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
gui = []
# 硬字幕提取（OCR）。RapidOCR = PaddleOCR 的 PP-OCR 模型转 ONNX：中英文质量好、torch-free、
# 纯 CPU、多平台一致；rapidocr 3.x 自带 PP-OCR mobile 模型（随包/离线可用，约 46M）。opencv 是
# rapidocr 的传递依赖(opencv_python full)；体积/Qt 冲突敏感时可改 opencv-python-headless（需 uv override）。
# rapidfuzz 缺失时代码回退 difflib。桌面打包须 uv sync --extra ocr，否则包内硬字幕不可用。
ocr = [
    "rapidocr>=3.0",
    "onnxruntime>=1.19",
    "rapidfuzz>=3.0",
]

[project.urls]
Homepage = "https://github.com/WEIFENG2333/VideoCaptioner"
Repository = "https://github.com/WEIFENG2333/VideoCaptioner"
Issues = "https://github.com/WEIFENG2333/VideoCaptioner/issues"

[project.scripts]
videocaptioner = "videocaptioner.cli.main:main"
videocaptioner-gui = "videocaptioner.ui.main:main"

# videocaptioner (no args), videocaptioner gui, and videocaptioner-gui launch the GUI.

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0-dev"
raw-options = { version_scheme = "no-guess-dev" }

[tool.hatch.build.hooks.vcs]
version-file = "videocaptioner/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "docs/",
    "legacy-docs/",
    "work-dir/",
    "AppData/",
    "output/",
    "scripts/",
    "tests/",
    ".github/",
]

[tool.hatch.build.targets.wheel]
packages = ["videocaptioner"]

[tool.hatch.build.targets.wheel.force-include]
# repo 的 resource/ 是唯一来源；安装后落到 videocaptioner/resources/，
# 与 config.py 的 _PACKAGE_RESOURCE_PATH 解析一致。fonts 必须包含：
# 默认字幕样式主字体是 LXGW WenKai，缺了它 pip 用户默认渲染就回退错字体。
"resource/assets" = "videocaptioner/resources/assets"
"resource/subtitle_styles" = "videocaptioner/resources/subtitle_styles"
"resource/i18n" = "videocaptioner/resources/i18n"
"resource/fonts" = "videocaptioner/resources/fonts"

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
override-dependencies = [
    "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
    "PyQt5-Qt5>=5.15.11; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    # i18n 开发期工具：抽取 .pot / 维护 .po / 编译 .mo（运行时只用标准库 gettext，不需 Babel）
    "babel>=2.14.0",
    # GUI deps for development
    "PyQt5==5.15.11",
    "PyQt-Fluent-Widgets==1.8.4",
    "psutil>=7.2.2",
    "GPUtil>=1.4.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["videocaptioner"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "work-dir",
    "AppData",
    "resource",
    "**/node_modules"
]
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportGeneralTypeIssues = false
reportOptionalOperand = "warning"
reportOptionalMemberAccess = false
reportArgumentType = "warning"
reportCallIssue = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnusedImport = "warning"
reportUnusedVariable = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short --disable-warnings"
markers = [
    "integration: Integration tests that require external services",
    "slow: Slow running tests",
    "llm: Tests that require LLM API access",
    "translator: Tests for translation modules",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
